<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register | SoleStudio</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">

        <div class="container header-inner">

            <!-- Website Logo -->
            <a class="logo" href="index.html">
                <span class="logo-mark">S</span>
                SOLE<span class="logo-accent">STUDIO</span>
            </a>

            <!-- Navigation Menu -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="cart.html">
                    Cart <span class="badge" id="cart-count">0</span>
                </a>
            </nav>

            <!-- Login / Logout Links -->
            <div id="auth-links" class="auth-links"></div>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- ================= REGISTRATION SECTION ================= -->
        <section class="container form-section">

            <div class="form-card">

                <!-- Section Heading -->
                <span class="eyebrow">
                    JOIN THE CLUB
                </span>

                <h1>Create an account</h1>

                <p>
                    Register to explore a smoother checkout experience.
                </p>


                <!-- ================= REGISTRATION FORM ================= -->
                <form onsubmit="register(event)" novalidate>

                    <!-- Full Name -->
                    <label for="name">
                        Full name
                    </label>

                    <input
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        minlength="2"
                    >


                    <!-- Email Address -->
                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >


                    <!-- Password -->
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <!-- Confirm Password -->
                    <label for="confirm">
                        Confirm password
                    </label>

                    <input
                        id="confirm"
                        name="confirm"
                        type="password"
                        autocomplete="new-password"
                        required
                    >


                    <!-- Validation Error Message -->
                    <p
                        class="error"
                        id="form-error"
                        role="alert"
                        hidden
                    ></p>


                    <!-- Register Button -->
                    <button
                        class="button wide"
                        type="submit"
                    >
                        Create account →
                    </button>

                </form>


                <!-- Login Link -->
                <p class="form-foot">
                    Already registered?
                    <a href="login.html">
                        Log in
                    </a>
                </p>


                <!-- Demo Information -->
                <p class="small-note">
                    Academic demo: accounts are stored in this browser only.
                </p>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">

        <div class="container footer-inner">

            <strong>SOLESTUDIO</strong>

            <span>
                Built for the next step. © 2026 ·
                Academic demo — no real purchases.
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product Data -->
    <script src="js/data.js"></script>

    <!-- Authentication Functionality -->
    <script src="js/auth.js"></script>

    <!-- Shopping Cart Functionality -->
    <script src="js/cart.js"></script>

</body>

</html>
