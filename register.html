<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SoleStudio</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="logo-mark">S</span> SOLE<span class="logo-accent">STUDIO</span></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Shop</a><a href="cart.html">Cart <span class="badge" id="cart-count">0</span></a></nav><div id="auth-links" class="auth-links"></div></div></header><main><section class="container form-section"><div class="form-card"><span class="eyebrow">JOIN THE CLUB</span><h1>Create an account</h1><p>Register to explore a smoother checkout experience.</p><form onsubmit="register(event)" novalidate><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required minlength="2"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><p class="error" id="form-error" role="alert" hidden></p><button class="button wide" type="submit">Create account →</button></form><p class="form-foot">Already registered? <a href="login.html">Log in</a></p><p class="small-note">Academic demo: accounts are stored in this browser only.</p></div></section></main><footer class="site-footer"><div class="container footer-inner"><strong>SOLESTUDIO</strong><span>Built for the next step. © 2026 · Academic demo — no real purchases.</span></div></footer><script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script></body></html>
