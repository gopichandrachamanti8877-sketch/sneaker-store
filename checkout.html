<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Checkout | SoleStudio</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">

        <div class="container header-inner">

            <!-- Website Logo -->
            <a class="logo" href="index.html">
                <span class="logo-mark">S</span>
                SOLE<span class="logo-accent">STUDIO</span>
            </a>

            <!-- Navigation Menu -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="cart.html">
                    Cart <span class="badge" id="cart-count">0</span>
                </a>
            </nav>

            <!-- Authentication Links -->
            <div id="auth-links" class="auth-links"></div>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <section class="container section">

            <span class="eyebrow">ALMOST THERE</span>

            <h1 class="page-title">Checkout</h1>

            <div class="checkout-layout">

                <!-- ================= CHECKOUT FORM ================= -->
                <form
                    class="checkout-form"
                    onsubmit="submitOrder(event)"
                    novalidate
                >

                    <h2>Shipping details</h2>

                    <p class="small-note">
                        Signed in as <span id="checkout-email"></span>
                    </p>

                    <!-- Full Name -->
                    <label for="fullname">Full name</label>
                    <input
                        id="fullname"
                        name="fullname"
                        autocomplete="name"
                        required
                    >

                    <!-- Email -->
                    <label for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                    >

                    <!-- Street Address -->
                    <label for="address">Street address</label>
                    <input
                        id="address"
                        name="address"
                        autocomplete="street-address"
                        required
                    >

                    <!-- City -->
                    <label for="city">City</label>
                    <input
                        id="city"
                        name="city"
                        autocomplete="address-level2"
                        required
                    >

                    <!-- Postal Code and Country -->
                    <div class="two-fields">

                        <div>
                            <label for="zip">Postal code</label>
                            <input
                                id="zip"
                                name="zip"
                                autocomplete="postal-code"
                                required
                            >
                        </div>

                        <div>
                            <label for="country">Country</label>
                            <input
                                id="country"
                                name="country"
                                autocomplete="country-name"
                                required
                            >
                        </div>

                    </div>

                    <!-- Validation Error Message -->
                    <p
                        class="error"
                        id="form-error"
                        role="alert"
                        hidden
                    ></p>

                    <!-- Place Order Button -->
                    <button
                        class="button wide"
                        type="submit"
                    >
                        Place demo order →
                    </button>

                    <p class="small-note">
                        No payment is collected or processed.
                    </p>

                </form>


                <!-- ================= ORDER SUMMARY ================= -->
                <aside class="summary">

                    <h2>Order summary</h2>

                    <div class="summary-row grand">
                        <span>Total</span>
                        <strong id="checkout-total"></strong>
                    </div>

                    <p>Free demo shipping</p>

                </aside>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">

        <div class="container footer-inner">

            <strong>SOLESTUDIO</strong>

            <span>
                Built for the next step. © 2026 ·
                Academic demo — no real purchases.
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product Data -->
    <script src="js/data.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Shopping Cart -->
    <script src="js/cart.js"></script>

    <!-- Checkout Functionality -->
    <script src="js/checkout.js"></script>

</body>

</html>
