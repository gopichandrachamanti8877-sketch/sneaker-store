<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shop | SoleStudio</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">

        <div class="container header-inner">

            <!-- Website Logo -->
            <a class="logo" href="index.html">
                <span class="logo-mark">S</span>
                SOLE<span class="logo-accent">STUDIO</span>
            </a>

            <!-- Navigation Menu -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="cart.html">
                    Cart <span class="badge" id="cart-count">0</span>
                </a>
            </nav>

            <!-- Login / Logout Links -->
            <div id="auth-links" class="auth-links"></div>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- ================= PRODUCT CATALOGUE ================= -->
        <section class="container section">

            <!-- Section Heading -->
            <span class="eyebrow">
                THE COLLECTION
            </span>

            <h1 class="page-title">
                Sneakers worth a second look.
            </h1>

            <p class="lead">
                Find the perfect fit for your everyday rotation.
            </p>


            <!-- ================= SEARCH SECTION ================= -->
            <div class="search-row">

                <!-- Search Input -->
                <input
                    id="search"
                    type="search"
                    placeholder="Search by name, brand or category"
                    aria-label="Search products"
                    oninput="searchProducts()"
                >

                <!-- Clear Search Button -->
                <button
                    class="button outline"
                    onclick="clearSearch()"
                >
                    Clear
                </button>

            </div>


            <!-- No Results Message -->
            <p id="no-results" hidden>
                No sneakers found. Try a different search.
            </p>


            <!-- ================= PRODUCT LIST ================= -->
            <!-- Products are dynamically displayed using JavaScript -->
            <div
                class="product-grid"
                id="product-list"
            ></div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">

        <div class="container footer-inner">

            <strong>SOLESTUDIO</strong>

            <span>
                Built for the next step. © 2026 ·
                Academic demo — no real purchases.
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product Data -->
    <script src="js/data.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Shopping Cart Functionality -->
    <script src="js/cart.js"></script>

    <!-- Product Search Functionality -->
    <script src="js/search.js"></script>

    <!-- Display All Products -->
    <script>
        renderProducts(products);
    </script>

</body>

</html>
