<!DOCTYPE html>

<body>

<header>
  <h1>Sneaker Store</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
  </nav>

<h2 style="text-align:center;">Sneakers</h2>

<input id="search" placeholder="Search by name or brand" oninput="searchProducts()">
<button onclick="clearSearch()">Clear</button>

<p id="no-results" style="display:none; text-align:center;">No sneakers found.</p>

<div class="product-grid" id="product-list"></div>

<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script>
  const list = document.getElementById("product-list");

  function renderProducts(arr) {
    list.innerHTML = arr.map(p => `
      <div class="product-card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>${p.brand}</p>
        <p>$${p.price}</p>
        <p>${p.category}</p>
        <a href="product.html?id=${p.id}">View Details</a>
      </div>
    `).join("");
  }

  renderProducts(products);
</script>

<footer>© 2026 Sneaker Store</footer>

</body>
</html>
