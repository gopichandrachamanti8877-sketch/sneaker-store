<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Order confirmation | SoleStudio</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">

        <div class="container header-inner">

            <!-- Website Logo -->
            <a class="logo" href="index.html">
                <span class="logo-mark">S</span>
                SOLE<span class="logo-accent">STUDIO</span>
            </a>

            <!-- Navigation Menu -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="cart.html">
                    Cart <span class="badge" id="cart-count">0</span>
                </a>
            </nav>

            <!-- Login / Logout Links -->
            <div id="auth-links" class="auth-links"></div>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- ================= ORDER CONFIRMATION SECTION ================= -->
        <section class="container section">

            <div class="empty-state">

                <!-- Confirmation Heading -->
                <span class="eyebrow">
                    ORDER PLACED
                </span>

                <h1>You're all set.</h1>

                <!-- Confirmation Message -->
                <p>
                    Your demo order has been recorded in this browser.
                    No payment was taken.
                </p>

                <!-- Demo Order Reference -->
                <p id="order-ref"></p>

                <!-- Continue Shopping Button -->
                <a class="button" href="products.html">
                    Continue shopping →
                </a>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">

        <div class="container footer-inner">

            <strong>SOLESTUDIO</strong>

            <span>
                Built for the next step. © 2026 ·
                Academic demo — no real purchases.
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product Data -->
    <script src="js/data.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Shopping Cart Functionality -->
    <script src="js/cart.js"></script>

    <!-- Display Demo Order Reference -->
    <script>

        try {

            // Retrieve the last demo order from browser storage
            const o = JSON.parse(
                localStorage.getItem("sneaker_last_demo_order")
            );

            // Display the order reference if an order exists
            if (o) {
                document.getElementById("order-ref").textContent =
                    "Demo order reference: " + o.id;
            }

        } catch {
            // Ignore invalid or unavailable order data
        }

    </script>

</body>

</html>
