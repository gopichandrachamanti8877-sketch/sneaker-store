<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cart | SoleStudio</title>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <div class="container header-inner">

            <!-- Website Logo -->
            <a class="logo" href="index.html">
                <span class="logo-mark">S</span>
                SOLE<span class="logo-accent">STUDIO</span>
            </a>

            <!-- Navigation Menu -->
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="cart.html">
                    Cart <span class="badge" id="cart-count">0</span>
                </a>
            </nav>

            <!-- Login / Logout Links -->
            <div id="auth-links" class="auth-links"></div>

        </div>
    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main>

        <!-- Shopping Cart Section -->
        <section class="container section">

            <span class="eyebrow">YOUR SELECTION</span>

            <h1 class="page-title">Shopping cart</h1>

            <div class="cart-layout">

                <!-- Cart Products -->
                <div id="cart-items"></div>

                <!-- Cart Total -->
                <div id="cart-total"></div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">

        <div class="container footer-inner">

            <strong>SOLESTUDIO</strong>

            <span>
                Built for the next step. © 2026 ·
                Academic demo — no real purchases.
            </span>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product Data -->
    <script src="js/data.js"></script>

    <!-- Authentication -->
    <script src="js/auth.js"></script>

    <!-- Shopping Cart Functionality -->
    <script src="js/cart.js"></script>

    <!-- Display Cart -->
    <script>
        renderCart();
    </script>

</body>

</html>
